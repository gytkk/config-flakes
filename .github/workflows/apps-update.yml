name: Update App Versions

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/apps-update.yml"
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Update app packages
    concurrency:
      group: app-package-updates
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Free disk space for Nix builds
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.29.1/install
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install workflow tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run app update scripts
        run: packages/scripts/update-all.sh

      - name: Record changed app packages
        shell: bash
        run: |
          changed_apps_file="$RUNNER_TEMP/changed-apps"
          : > "$changed_apps_file"

          git diff --name-only -- packages/apps \
            | awk -F/ '$1 == "packages" && $2 == "apps" && NF >= 4 { print $3 }' \
            | sort -u \
            | while IFS= read -r app; do
                if [ -f "packages/apps/$app/package.nix" ]; then
                  printf '%s\n' "$app"
                fi
              done > "$changed_apps_file"

      - name: Evaluate app package flake
        run: nix flake check ./packages --no-build

      - name: Build changed app packages
        shell: bash
        run: |
          while IFS= read -r app; do
            nix build "./packages#packages.x86_64-linux.$app" --no-link
          done < "$RUNNER_TEMP/changed-apps"

      - name: Diagnose Nix build failure
        if: failure()
        run: |
          free -h
          df -h / /nix
          sudo systemctl status nix-daemon --no-pager --full || true
          sudo journalctl -u nix-daemon --no-pager -n 200
          sudo journalctl -k --no-pager -n 200

      - name: Sync README version table
        run: packages/scripts/sync-readme-versions.sh

      - name: Commit and push updates
        shell: bash
        run: |
          git add packages
          if git diff --cached --quiet; then
            echo "No package changes after updates"
            exit 0
          fi

          app_versions=()
          while IFS= read -r app; do
            version=$(rg -m 1 -o 'version = "([^"]+)";' --replace '$1' "packages/apps/$app/package.nix")
            app_versions+=("$app v$version")
          done < "$RUNNER_TEMP/changed-apps"

          if [ "${#app_versions[@]}" -gt 0 ]; then
            versions=$(printf '%s, ' "${app_versions[@]}")
            message="chore(apps): update app versions (${versions%, })"
          else
            message="chore(apps): sync package metadata"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git push origin HEAD:main
