[metadata]
marker = ".agent-core-generated"
version = "1"

[skill_cli]
version = "1.7.2"

[skill_sources.local]
kind = "local"
path = "skills"

[skill_sources.local.skills]
codebase-design = "codebase-design"
code-review = "code-review"
data-analysis = "data-analysis"
data-visualization = "data-visualization"
devils-advocate = "devils-advocate"
diagnosing-bugs = "diagnosing-bugs"
korean = "korean"
openai-decisions = "openai-decisions"
parallel-research-merge = "parallel-research-merge"
pi-agent = "pi-agent"
repeated-work-analyzer = "repeated-work-analyzer"
research = "research"
theme-template-authoring = "theme-template-authoring"
user-friction-review = "user-friction-review"
writing-for-agents = "writing-for-agents"

[skill_sources.matt]
kind = "git"
url = "https://github.com/mattpocock/skills.git"
update = "latest-default-branch"
license = "LICENSE"

[skill_sources.matt.skills]
domain-modeling = "skills/engineering/domain-modeling"
grilling = "skills/productivity/grilling"
prototype = "skills/engineering/prototype"
tdd = "skills/engineering/tdd"
wizard = "skills/engineering/wizard"

[skill_sources.vercel]
kind = "git"
url = "https://github.com/vercel-labs/skills.git"
update = "latest-default-branch"
license = "LICENSE"

[skill_sources.vercel.skills]
find-skills = "skills/find-skills"

[skill_sources.impeccable]
kind = "git"
url = "https://github.com/pbakaus/impeccable.git"
update = "latest-default-branch"
license = "LICENSE"

[skill_sources.impeccable.skills]
impeccable = ".agents/skills/impeccable"

[skill_targets.shared]
runtimes = ["codex", "pi"]
skills = ["codebase-design", "code-review", "data-analysis", "data-visualization", "devils-advocate", "diagnosing-bugs", "domain-modeling", "find-skills", "grilling", "impeccable", "korean", "openai-decisions", "parallel-research-merge", "pi-agent", "prototype", "repeated-work-analyzer", "research", "tdd", "theme-template-authoring", "user-friction-review", "wizard", "writing-for-agents"]

[skill_targets.claude]
runtimes = ["claude"]
skills = ["codebase-design", "code-review", "data-analysis", "data-visualization", "diagnosing-bugs", "domain-modeling", "find-skills", "grilling", "korean", "openai-decisions", "parallel-research-merge", "prototype", "repeated-work-analyzer", "research", "tdd", "theme-template-authoring", "user-friction-review", "wizard", "writing-for-agents"]

[[documents]]
runtime = "claude"
output = "CLAUDE.md"
sources = ["rules/OPERATING.md", "rules/AGENTS.md", "rules/PROSE.md", "adapters/claude.md"]

[[documents]]
runtime = "codex"
output = "AGENTS.md"
sources = ["rules/OPERATING.md", "rules/AGENTS.md", "rules/PROSE.md", "rules/DELEGATION.md", "adapters/codex.md"]

[[documents]]
runtime = "pi"
output = "AGENTS.md"
sources = ["rules/AGENTS.md", "rules/PROSE.md", "adapters/pi.md"]

[[documents]]
runtime = "pi"
output = "APPEND_SYSTEM.md"
sources = ["rules/OPERATING.md"]

[runtimes.codex]
skills = ["codebase-design", "code-review", "data-analysis", "data-visualization", "devils-advocate", "diagnosing-bugs", "domain-modeling", "grilling", "parallel-research-merge", "prototype", "repeated-work-analyzer", "research", "resolving-merge-conflicts", "tdd", "theme-template-authoring", "openai-decisions", "user-friction-review", "wizard", "writing-for-agents"]
skill_output = "skills"

[runtimes.claude]
skills = ["codebase-design", "code-review", "data-analysis", "data-visualization", "diagnosing-bugs", "domain-modeling", "grilling", "parallel-research-merge", "prototype", "repeated-work-analyzer", "research", "resolving-merge-conflicts", "tdd", "theme-template-authoring", "openai-decisions", "user-friction-review", "wizard", "writing-for-agents"]
skill_output = "skills"

[runtimes.pi]
skills = ["codebase-design", "code-review", "data-analysis", "data-visualization", "devils-advocate", "diagnosing-bugs", "domain-modeling", "grilling", "parallel-research-merge", "pi-agent", "prototype", "repeated-work-analyzer", "research", "resolving-merge-conflicts", "tdd", "theme-template-authoring", "user-friction-review", "wizard", "writing-for-agents"]
skill_output = "skills"
