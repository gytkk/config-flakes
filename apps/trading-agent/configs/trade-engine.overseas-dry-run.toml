read_only = true
watchlist = ["AAPL", "MSFT"]

[market]
kind = "overseas_stock"
exchange_code = "NASD"
currency = "USD"
allowed_order_sessions = ["regular", "premarket", "aftermarket", "daytime"]

[storage]
main_db_path = ".local/state/trade-engine/overseas-dry-run-main.sqlite3"

[runtime]
market_tick_seconds = 30
off_hours_market_tick_seconds = 900
max_tick_runtime_seconds = 240

[kis]
environment = "live"
token_cache_path = ".local/state/trade-engine/kis-live-token.json"

[strategy]
id = "sma-crossover-v1"
short_window = 5
long_window = 20

[universe_discovery]
provider = "command"
command = "sh"
args = ["trade-engine/scripts/codex-universe"]
timeout_seconds = 600
refresh_seconds = 10800
auto_refresh = true

[advisor]
provider = "command"
command = "sh"
args = ["trade-engine/scripts/codex-advisor"]
timeout_seconds = 180
candidate_limit = 8
min_command_interval_seconds = 600
price_change_threshold_bps = 75

[sizing]
enabled = true

[exit_policy]
enabled = true
stop_loss_pct = "0.05"
take_profit_pct = "0.10"

[risk]
enable_live_trading = false
max_order_notional = "1000"
max_position_notional = "5000"
max_daily_loss = "1000"
max_daily_order_count = 3
