[package]
name = "trading-agent-toss-client"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[lib]
name = "trading_agent_toss_client"
path = "src/lib.rs"

[features]
default = []

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.39", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
trading-agent-kis-client = { path = "../kis-client" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
