[package]
name = "trade-engine"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[dependencies]
anstream = "1.0"
anstyle = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2"
rusqlite = { version = "0.37", features = ["bundled"] }
rust_decimal = { version = "1.39", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
tracing = "0.1"
trading-agent-kis-client = { path = "../kis-client" }
trading-agent-toss-client = { path = "../toss-client" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
