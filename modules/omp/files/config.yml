modelRoles:
  default: openai-codex/gpt-6-astra:high
  memory: openai-codex/gpt-6-astra:high
  image: openai-codex/gpt-image-2
  smol: openai-codex/gpt-6.1-terra:auto
  task: openai-codex/gpt-6.1-sol:high
  advisor: openai-codex/gpt-6-astra:xhigh
  plan: openai-codex/gpt-6-astra:high
  commit: openai-codex/gpt-6-luna:off
symbolPreset: nerd
composer:
  shape: pi
theme:
  dark: titanium
  light: light-one
setupVersion: 3
statusLine:
  preset: custom
  separator: pipe
  compactThinkingLevel: false
  leftSegments:
    - path
    - git
    - context_pct
    - subagents
  rightSegments:
    - usage
    - model
    - mode
cycleOrder:
  - default
  - task
disabledProviders:
  - claude
  - claude-plugins
dev:
  autoqaConsent: denied
  autoqa: false
extendedContext: true
task:
  showResolvedModelBadge: true
error:
  notify: "on"